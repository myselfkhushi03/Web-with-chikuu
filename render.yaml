services:
  - type: web
    name: web-with-chikuu-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
